<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <title>Movie Database Explore Project</title>
</head>
<body class="relative bg-lightPurple">
    <!-- header -->
    <header class="z-50 relative" id="header">
        <!-- container -->
        <div class="fixed top-0 right-0 left-0 bg-darkPurple">
            <!-- container for logo and search -->
            <div class="container mx-auto flex flex-col items-center space-y-6 px-6 py-5 md:space-y-0 md:space-x-20 md:flex-row">
                <!-- logo -->
                <div>
                    <a href="">
                        <img class="w-52" src="public/images/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="">
                    </a>
                </div>
                <!-- search input -->
                <div class="max-w-80 bg-white flex items-center px-4 py-2 md:space-x-10 rounded-full text-black">
                    <input type="search" class="outline-none placeholder:opacity-60 " id="search-input" placeholder="Search a movie...">
                    <!-- <div class="rounded-full p-2 bg-gray-100">
                    </div> -->
                    <img id="search-btn" class="hover:scale-105" src="public/images/search_icon.svg" alt="">
                </div>
            </div>
        </div>
    </header>

    <main class="mt-48 md:mt-32 pb-20 relative">

        <!--  container for filter and sort  -->
        <div class="container mx-auto flex flex-col px-10 py-4 mb-4 space-y-4">
            <!--  box for filter svg and dynamic container for genres -->
            <div class="flex space-x-4 flex-shrink-0">
                <button id="dropdown-button" class="flex  flex-shrink-0 border px-4 py-1 rounded-3xl hover:scale-105">
                    <img src="public/images/filter.svg" alt="filter-icon">
                </button>
                <div class="w-[2px] bg-white bg-opacity-60 "></div>

                <div id="dynamic-genres" class="flex space-x-4 overflow-x-auto whitespace-nowrap flex-nowrap"></div>
            </div>
            <!--  box for sort options  -->
            <div class="flex items-center md:justify-end justify-start">
                <!--  sort container -->
                <div class="flex items-center justify-center">
                    <label class="text-white text-base mr-4" for="sort-by-selector">Sort by</label>
                    <select
                            id="sort-by-selector"
                            class="bg-inherit hover:bg-opacity-80 px-4 py-1 rounded-lg w-fit text-white focus:outline-none focus:border-dashed focus:border-2 border-white appearance-none relative"
                    >
                        <option value="none">None </option>
                        <option value="ranking">Ranking</option>
                        <option value="releaseDate">Release date</option>
                        <option value="popularity">Popularity</option>
<!--                        <option value="runtime">Runtime</option>-->
                    </select>
                   <button class="hover:bg-darkPurple rounded-full p-3">
                       <img id="arr-rotate" class="rotate-180" src="public/images/arrow.svg" alt="">
                   </button>
                </div>
            </div>
        </div>

        <!-- Drop-box that contains filter options -->
        <div id="dropdown-menu" class="container mx-auto hidden items-start justify-center w-[600px] bg-darkPurple bg-opacity-100 p-6 rounded-md fixed top-50 left-1/2 transform -translate-x-1/2 z-10">
            <div class="flex w-full flex-col items-center justify-start space-y-4">
                <div class="flex w-full justify-end">
                    <button id="close-dropdown-menu">
                        <img class="transition-transform ease-linear hover:rotate-90" src="public/images/closeBtn.svg" alt="close button">
                    </button>
                </div>
                <!--   container for fetch genres   -->
                <div class="flex w-full flex-col justify-start space-y-4">
                    <div class="space-y-1">
                        <h1 class="text-yell text-2xl text-left">Genres</h1>
                    </div>
                    <div id="genres-container" class="flex flex-1 gap-3 flex-wrap"></div>
                </div>
            </div>
        </div>

        <!-- container for movie cards -->
        <div id="movie-container" class="container mx-auto grid justify-items-center items-start px-6 gap-8
       grid-cols-[repeat(auto-fit,_minmax(208px,_1fr))]">
        </div>
        <!--        md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 sm:grid-cols-2 min-[520px]:grid-cols-2-->
        <!-- pagination panel -->
        <div class="mt-10 flex items-center justify-center  px-4 py-3 sm:px-6">
          <!-- buttons for small screen -->
            <div class="flex flex-1 justify-center items-center space-x-10 sm:hidden">
              
              <div class="group prevPage flex items-center space-x-3 rounded-3xl border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                <div class="border rounded-full p-1 group-hover:bg-darkPurple transition-transform">
                  <svg class="h-6 w-6 group-hover:text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
                  </svg>
                </div>
                <a href="#" class="text-base text-center">Prev</a>
              </div>

              <div class="group nextPage flex items-center space-x-3 rounded-3xl border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                <a href="#" class="text-base text-center">Next</a>
                <div class="border rounded-full p-1 group-hover:bg-darkPurple transition-transform">
                  <svg class="h-6 w-6 group-hover:text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                  </svg>
                </div>
              </div>
              
            </div>

            <div class="hidden space-x-[1px] md:justify-center sm:flex sm:flex-1 sm:items-center sm:justify-between">
             
                <a href="#" class="prevPage relative inline-flex items-center rounded-l-md px-2 py-2 text-white ring-1 ring-inset ring-white hover:bg-darkPurple hover:bg-opacity-80 focus:z-20 focus:outline-offset-0">
                  <!-- <span class="sr-only">Previous</span> -->
                  <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
                  </svg>
                </a>

                <nav class="pagination-container isolate inline-flex justify-center space-x-px rounded-md shadow-sm" aria-label="Pagination"></nav>

                <a href="#" class="nextPage relative inline-flex items-center rounded-r-md px-2 py-2 text-white ring-1 ring-inset ring-white hover:bg-darkPurple hover:bg-opacity-80 focus:z-20 focus:outline-offset-0">
                  <!-- <span class="sr-only">Next</span> -->
                  <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                  </svg>
                </a>
            </div>
          </div>

        <!-- Full info about movie  -->
        <div id="full-info-container" class="absolute hidden items-center bg-lightPurple w-full h-screen top-0 left-1/2 transform -translate-x-1/2 px-6 ">

        </div>

    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
